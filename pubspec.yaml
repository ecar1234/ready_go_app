name: ready_go_project
description: A new Flutter project.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+955

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  gap: ^3.0.1
  calendar_date_picker2: ^1.1.7
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  get_it: ^8.0.0
  flutter_slidable: ^3.1.2
  image_picker: ^1.1.2
  open_file: ^3.5.9
  get: ^4.6.6
  json_annotation: ^4.9.0
  flutter_bloc: ^8.1.6
  intl: any
#  expandable_page_view: ^1.0.17
  uuid: ^4.5.1
  accordion: ^2.6.0
#  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  flutter_native_splash: ^2.4.1
  firebase_core: ^3.8.0
  firebase_analytics: ^11.3.5
  firebase_remote_config: ^5.5.0
  google_mobile_ads: ^5.2.0
  path_provider: ^2.1.5
  logger: ^2.5.0
#  dotted_border: ^2.1.0
  dotted_line: ^3.2.3
  in_app_purchase: ^3.2.1
  fl_chart: ^0.70.2
  package_info_plus: ^8.3.0
  file_picker: ^10.1.0
#  flutter_pdfview: ^1.4.0
  syncfusion_flutter_pdfviewer: ^29.1.37
  cloud_functions: ^5.4.0
  http: ^1.3.0
  google_fonts: ^6.2.1
  flutter_localizations:
      sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  json_serializable: ^6.8.0
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.14.2
  analyzer: ^7.3.0
  in_app_purchase_platform_interface: ^1.4.0

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
   - assets/images/
   - assets/fonts/

  fonts:
      - family: Nanum
        fonts:
         - asset: assets/fonts/NanumSquareNeoOTF-Bd.otf
           weight: 600
         - asset: assets/fonts/NanumSquareNeoOTF-Eb.otf
           weight: 700
         - asset: assets/fonts/NanumSquareNeoOTF-Hv.otf
         - asset: assets/fonts/NanumSquareNeoOTF-Lt.otf
         - asset: assets/fonts/NanumSquareNeoOTF-Rg.otf
           weight: 400
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_foreground: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  remove_alpha_ios: true
  min_sdk_android: 34



flutter_native_splash:
    android: true
    ios: true
#    color: "#FFFFFF"
    image: "assets/images/splash.png"
    background_image: "assets/images/splash_background.png"

    android_12:
      color: "#FFFFFF"
      image: "assets/images/icon.png"
#      background_image: "assets/images/splash_background.png"
#      icon_background_color: "#FFFFFF"

    web: false